<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img" aria-label="ReForge pipeline: Ingest, X-Ray, Doctor, Plan, Impact, Build, Approve, Execute, Verify" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="170" rx="14" fill="url(#bg)"/>
  <text x="450" y="30" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#8fffc7" letter-spacing="3">EVIDENCE → PLAN → PATCH → APPROVAL → VERIFIED</text>

  <!-- track -->
  <line x1="60" y1="80" x2="840" y2="80" stroke="#00ff9c" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- nodes -->
  <g font-family="Fira Code, Consolas, monospace" font-size="11" fill="#d7f5e8" text-anchor="middle">
    <g transform="translate(60,80)"><circle r="13" fill="#0f2027" stroke="#00ff9c" stroke-width="2"/><circle r="13" fill="none" stroke="#00ff9c" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="1;0.1;0.1" keyTimes="0;0.12;1" dur="6.75s" begin="0s" repeatCount="indefinite"/></circle><text y="36">Ingest</text></g>
    <g transform="translate(157.5,80)"><circle r="13" fill="#0f2027" stroke="#00ff9c" stroke-width="2"/><circle r="13" fill="none" stroke="#00ff9c" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="1;0.1;0.1" keyTimes="0;0.12;1" dur="6.75s" begin="0.75s" repeatCount="indefinite"/></circle><text y="36">X-Ray</text></g>
    <g transform="translate(255,80)"><circle r="13" fill="#0f2027" stroke="#00ff9c" stroke-width="2"/><circle r="13" fill="none" stroke="#00ff9c" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="1;0.1;0.1" keyTimes="0;0.12;1" dur="6.75s" begin="1.5s" repeatCount="indefinite"/></circle><text y="36">Doctor</text></g>
    <g transform="translate(352.5,80)"><circle r="13" fill="#0f2027" stroke="#00ff9c" stroke-width="2"/><circle r="13" fill="none" stroke="#00ff9c" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="1;0.1;0.1" keyTimes="0;0.12;1" dur="6.75s" begin="2.25s" repeatCount="indefinite"/></circle><text y="36">Plan</text></g>
    <g transform="translate(450,80)"><circle r="13" fill="#0f2027" stroke="#00ff9c" stroke-width="2"/><circle r="13" fill="none" stroke="#00ff9c" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="1;0.1;0.1" keyTimes="0;0.12;1" dur="6.75s" begin="3s" repeatCount="indefinite"/></circle><text y="36">Impact</text></g>
    <g transform="translate(547.5,80)"><circle r="13" fill="#0f2027" stroke="#00ff9c" stroke-width="2"/><circle r="13" fill="none" stroke="#00ff9c" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="1;0.1;0.1" keyTimes="0;0.12;1" dur="6.75s" begin="3.75s" repeatCount="indefinite"/></circle><text y="36">Build</text></g>
    <g transform="translate(645,80)"><circle r="13" fill="#0f2027" stroke="#ffc857" stroke-width="2"/><circle r="13" fill="none" stroke="#ffc857" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="1;0.1;0.1" keyTimes="0;0.12;1" dur="6.75s" begin="4.5s" repeatCount="indefinite"/></circle><text y="36">Approve</text></g>
    <g transform="translate(742.5,80)"><circle r="13" fill="#0f2027" stroke="#00ff9c" stroke-width="2"/><circle r="13" fill="none" stroke="#00ff9c" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="1;0.1;0.1" keyTimes="0;0.12;1" dur="6.75s" begin="5.25s" repeatCount="indefinite"/></circle><text y="36">Execute</text></g>
    <g transform="translate(840,80)"><circle r="13" fill="#0f2027" stroke="#00ff9c" stroke-width="2"/><circle r="13" fill="none" stroke="#00ff9c" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="1;0.1;0.1" keyTimes="0;0.12;1" dur="6.75s" begin="6s" repeatCount="indefinite"/></circle><text y="36">Verify</text></g>
  </g>

  <!-- traveling pulse -->
  <circle r="6" fill="#00ff9c" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M60 80 H840"/>
  </circle>

  <text x="450" y="150" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#9db8b0">proposal ≠ approval ≠ execution ≠ verification — the human gate is amber on purpose</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
